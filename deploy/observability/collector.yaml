extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  bearertokenauth/receiver:
    token: ${env:OTEL_COLLECTOR_TOKEN}
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true
    fsync: true
    max_size: 268435456

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth/receiver

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 128
    send_batch_max_size: 256

exporters:
  otlphttp/langfuse:
    traces_endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:LANGFUSE_AUTHORIZATION}
      x-langfuse-ingestion-version: "4"
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 2000
      storage: file_storage

service:
  extensions: [health_check, bearertokenauth/receiver, file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/langfuse]
