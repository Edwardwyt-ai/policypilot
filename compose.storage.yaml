name: policypilot-storage
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: policypilot
      POSTGRES_USER: policypilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run storage_services.py init first}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policypilot -d policypilot"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4.5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run storage_services.py init first}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly no"]
    ports: ["127.0.0.1:16379:6379"]
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.15.5
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Run storage_services.py init first}
    ports: ["127.0.0.1:16333:6333"]
    volumes: ["qdrant:/qdrant/storage"]
    restart: unless-stopped
  minio:
    image: policypilot/minio:source-7aac2a2c5b7c
    pull_policy: never
    build:
      context: ./deploy/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run storage_services.py init first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run storage_services.py init first}
    command: ["server", "/data", "--console-address", ":9001"]
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: ["minio:/data"]
    restart: unless-stopped
volumes:
  postgres:
  qdrant:
  minio:
